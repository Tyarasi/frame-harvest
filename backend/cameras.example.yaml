# Salin file ini jadi cameras.yaml lalu isi dengan RTSP URL CCTV yang sebenarnya.
# cameras.yaml TIDAK di-commit ke git (ada credential di dalamnya).
#
# Format URL RTSP umumnya:
#   rtsp://<user>:<password>@<ip-kamera>:<port>/<path-stream>
# Path stream beda-beda tergantung merk DVR/NVR (Hikvision, Dahua, dst) —
# cek manual perangkat atau tanya ke owner/installer CCTV.

cameras:
  - id: cam1
    name: "Kamera Depan"
    rtsp_url: "rtsp://admin:password@192.168.1.100:554/Streaming/Channels/101"

  - id: cam2
    name: "Kamera Belakang"
    rtsp_url: "rtsp://admin:password@192.168.1.101:554/Streaming/Channels/101"
